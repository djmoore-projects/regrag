[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "2.0.0"
description = "Production-grade RAG over U.S. financial regulations: hybrid retrieval, reranking, paragraph-level citations, Ragas evaluation, Phoenix tracing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Derek Moore", email = "derek@aismartr.com" }]
keywords = ["rag", "hybrid-search", "bm25", "pgvector", "reranking", "ragas", "citations", "regulation"]

dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.8",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "lxml>=5.0",
    "numpy>=1.26",
    "arize-phoenix-otel>=0.10",
    "openinference-instrumentation-anthropic>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]
eval = ["ragas==0.4.3", "langchain-community==0.3.31"]

[tool.setuptools.packages.find]
include = ["regrag*"]

[tool.setuptools.package-data]
regrag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
